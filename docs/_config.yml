title: NFTSol Documentation
description: User-facing guides for the NFTSol Solana NFT marketplace.
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

relative_links:
  enabled: true
  collections: true

include:
  - CONTRIBUTING.md
  - SECURITY.md
  - TECHNICAL-DOCS.md
  - CLAUDE.md

exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules

show_downloads: false

github:
  repository_url: https://github.com/TheoryofShadows/nftsol
