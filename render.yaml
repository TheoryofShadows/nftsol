# render.yaml
services:
  - type: web
    name: nftsol-backend
    env: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: cd apps/backend && npm ci && npm run build
    startCommand: cd apps/backend && node dist/index.js
    autoDeploy: true
    envVars:
      NODE_ENV: production
      # PORT is automatically set by Render - don't override it
      DATABASE_URL:
        fromDatabase:
          name: nftsol-db
          property: connectionString
      # CRITICAL: Must set ALLOWED_ORIGINS or server will fail to start
      ALLOWED_ORIGINS: https://nftsol.app,https://www.nftsol.app,https://market.nftsol.app
      SOLANA_RPC_URL: https://mainnet.helius-rpc.com/?api-key=ea0ed024-cd7c-4338-8b9b-b6be4d004d36
      SOLANA_RPC_DEVNET: https://api.devnet.solana.com
      SOLANA_CLUSTER: mainnet-beta
      # CRITICAL: Must set these or server will fail
      PLATFORM_SECRET_KEY_BASE58: YOUR_PLATFORM_SECRET_KEY_HERE
      JWT_SECRET: YOUR_JWT_SECRET_HERE
      ADMIN_WALLETS: YOUR_ADMIN_WALLET_ADDRESS
      # CLOUT Configuration
      CLOUT_PROGRAM_ID: 26iJ37BE3icVtoo2QRkfjtYXFHMudG2sbTHAnhF2D6ab
      CLOUT_MINT: 26iJ37BE3icVtoo2QRkfjtYXFHMudG2sbTHAnhF2D6ab
      REWARDS_OWNER: 3XEs3MJ8PFiqTTqrK6RAkK9vt95jQQ1hKNNKHiE6jJ3o
      # Program IDs
      MARKET_PROGRAM_ID: HTs1hErzM8MywaUojfUY7QA1T6gLQD977R3HsCnKj7m7
      LOYALTY_PROGRAM_ID: 2TujfT3Czd2ncawJ6ZLmfGeJ2t1Ugb9bqEvxSE2EKoo9
      # REWARDS_VAULT is auto-calculated from REWARDS_OWNER + CLOUT_MINT (deterministic ATA)