# render.yaml
services:
  - type: web
    name: nftsol-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd apps/backend && npm ci && npm run build
    startCommand: cd apps/backend && node dist/index.js
    autoDeploy: true
    envVars:
      NODE_ENV: production
      DATABASE_URL:
        fromDatabase:
          name: nftsol-db
          property: connectionString
      VITE_API_BASE: https://nftsol-dev.onrender.com
      SOLANA_RPC_DEVNET: https://api.devnet.solana.com
      NFT_STORAGE_KEY: <YOUR_REAL_KEY>
      CLOUT_PROGRAM_ID: C1oUt9v7NxKp3fA1b2cD4eF5gH6iJ7kL8mN9oPqRsTu
      MARKET_PROGRAM_ID: MktEsc123abc456def789ghi012jkl345mno678pqrs