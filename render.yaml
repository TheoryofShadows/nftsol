# render.yaml
services:
  - type: web
    name: nftsol-backend
    env: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: cd apps/backend && npm ci && npm run build
    startCommand: cd apps/backend && node dist/index.js
    autoDeploy: true
    envVars:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL:
        fromDatabase:
          name: nftsol-db
          property: connectionString
      VITE_API_BASE: https://nftsol.onrender.com
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      SOLANA_RPC_DEVNET: https://api.devnet.solana.com
      SOLANA_CLUSTER: mainnet-beta
      PLATFORM_SECRET_KEY_BASE58: YOUR_PLATFORM_SECRET_KEY_HERE
      PLATFORM_PUBLIC_KEY: 7boWRDfn3aPE88jt5qpiryPLw56EneXhEMUdfbd5TR9f
      NFT_STORAGE_KEY: <YOUR_REAL_NFT_STORAGE_KEY>
      CLOUT_PROGRAM_ID: 26iJ37BE3icVtoo2QRkfjtYXFHMudG2sbTHAnhF2D6ab
