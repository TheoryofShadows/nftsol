# render.yaml
services:
  - type: web
    name: nftsol-backend
    env: node
    region: oregon
    plan: starter
    branch: develop
    buildCommand: cd apps/backend && npm ci && npm run build
    startCommand: cd apps/backend && node dist/index.js
    autoDeploy: true
    envVars:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL:
