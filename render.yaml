# render.yaml
services:
  - type: web
    name: nftsol-backend
    env: node
    region: oregon
    plan: starter
    branch: develop
    buildCommand: cd apps/backend && npm ci && npm run build
    startCommand: cd apps/backend && node dist/index.js
    autoDeploy: true
    envVars:
      NODE_ENV: production
      DATABASE_URL:
        fromDatabase:
          name: nftsol-db
          property: connectionString
      VITE_API_BASE: https://nftsol-dev.onrender.com
      SOLANA_RPC_DEVNET: https://api.devnet.solana.com
      NFT_STORAGE_KEY: <YOUR_REAL_NFT_STORAGE_KEY>
      CLOUT_PROGRAM_ID: CE9VN3Bkh4Mn77GSTdfhf7KNpUKeqpmMX7s8463EFvJE
      MARKET_PROGRAM_ID: HTs1hErzM8MywaUojfUY7QA1T6gLQD977R3HsCnKj7m7
