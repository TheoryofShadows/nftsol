# render.yaml
services:
  - type: web
    name: nftsol-backend
    env: node
    region: oregon
    plan: starter
    branch: develop
    buildCommand: cd apps/backend && npm ci && npm run build
    startCommand: cd apps/backend && node dist/index.js
    autoDeploy: true
    envVars:
      NODE_ENV: production
      DATABASE_URL:
        fromDatabase:
          name: nftsol-db
          property: connectionString
      VITE_API_BASE: https://nftsol-dev.onrender.com
      SOLANA_RPC_DEVNET: https://api.devnet.solana.com
      NFT_STORAGE_KEY: <YOUR_REAL_NFT_STORAGE_KEY>
      CLOUT_PROGRAM_ID: <REAL_ID_AFTER_DEPLOY>
      MARKET_PROGRAM_ID: <REAL_ID_AFTER_DEPLOY>
      LOYALTY_PROGRAM_ID: <REAL_ID_AFTER_DEPLOY>
      REWARDS_VAULT: <REAL_ID_AFTER_DEPLOY>