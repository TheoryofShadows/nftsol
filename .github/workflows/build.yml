name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
    - name: Install client dependencies
      run: |
        cd client
        npm ci
    - name: Build client
      run: |
        cd client
        npm run build
    - name: Upload client build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: client-build
        path: client/dist/

  build-server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    - name: Install server dependencies
      run: |
        cd server
        npm ci
    - name: Build server
      run: |
        cd server
        npm run build
    - name: Upload server build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: server-build
        path: server/dist/

