name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Secret scan
        run: node scripts/scan-secrets.js
        continue-on-error: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies - Client
        working-directory: client
        run: |
          npm ci || npm install
        continue-on-error: false

      - name: Install dependencies - Backend
        working-directory: apps/backend
        run: |
          npm ci || npm install
        continue-on-error: false

      - name: Install dependencies - Shared
        # shared/ is a real package (@nftsol/shared) with its own deps (zod).
        # Client + backend type-check ../shared, so its deps must be resolvable
        # in CI (locally they resolve via a hoisted root node_modules that CI
        # never creates). Without this, tsc reports TS2307 "Cannot find module 'zod'".
        working-directory: shared
        run: |
          npm ci || npm install
        continue-on-error: false

      - name: Build Client
        working-directory: client
        run: npm run build
        continue-on-error: false

      - name: Build Backend
        working-directory: apps/backend
        run: npm run build
        continue-on-error: false

      - name: Lint Client
        working-directory: client
        run: npm run lint
        continue-on-error: false

      - name: Lint Backend
        working-directory: apps/backend
        run: npm run lint
        continue-on-error: false

      - name: Type Check - Backend
        working-directory: apps/backend
        run: npm run type-check
        continue-on-error: false

      - name: Type Check - Client
        working-directory: client
        run: npm run type-check
        continue-on-error: false

      - name: Test Backend
        working-directory: apps/backend
        run: npm test -- --no-coverage
        continue-on-error: false

      - name: Test Client
        working-directory: client
        run: npm test -- --run --no-coverage
        continue-on-error: true

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            client/dist
            apps/backend/dist
          retention-days: 5
