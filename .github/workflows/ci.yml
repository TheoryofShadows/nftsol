name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root tools
        run: npm ci --ignore-scripts

      - name: Client install and build
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Backend install and build
        working-directory: apps/backend
        run: |
          npm ci
          npm run build

      - name: Lint
        run: npm run lint
