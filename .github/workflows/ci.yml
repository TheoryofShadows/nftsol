name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & build server
        working-directory: ./server
        run: |
          npm ci || npm install
          npm run build || echo "no server build step"

      - name: Install & build client
        working-directory: ./client
        run: |
          npm ci || npm install
          npm run build
