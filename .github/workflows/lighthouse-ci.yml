name: Lighthouse CI Performance Audit

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lighthouse-ci:
    name: Lighthouse CI Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: |
          cd client
          npm run build
          echo "✅ Frontend built successfully"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Run Lighthouse CI
        run: |
          lhci autorun
        continue-on-error: true

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

      - name: Comment PR with Lighthouse Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read Lighthouse results
            const resultsPath = '.lighthouseci/lhr.json';

            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));

              // Extract scores
              const performance = Math.round(results.categories.performance.score * 100);
              const accessibility = Math.round(results.categories.accessibility.score * 100);
              const bestPractices = Math.round(results.categories['best-practices'].score * 100);
              const seo = Math.round(results.categories.seo.score * 100);

              // Extract Web Vitals
              const fcp = results.audits['first-contentful-paint']?.numericValue || 0;
              const lcp = results.audits['largest-contentful-paint']?.numericValue || 0;
              const cls = results.audits['cumulative-layout-shift']?.numericValue || 0;
              const tbt = results.audits['total-blocking-time']?.numericValue || 0;
              const ttfb = results.audits['time-to-first-byte']?.numericValue || 0;

              // Create badge emojis
              const badge = (score) => {
                if (score >= 90) return '🟢';
                if (score >= 80) return '🟠';
                return '🔴';
              };

              const comment = `## ⚡ Lighthouse CI Results

### Audit Scores
${badge(performance)} **Performance:** ${performance}/100
${badge(accessibility)} **Accessibility:** ${accessibility}/100
${badge(bestPractices)} **Best Practices:** ${bestPractices}/100
${badge(seo)} **SEO:** ${seo}/100

### Core Web Vitals
| Metric | Value | Target |
|--------|-------|--------|
| FCP | ${(fcp/1000).toFixed(2)}s | < 1.8s |
| LCP | ${(lcp/1000).toFixed(2)}s | < 2.5s |
| CLS | ${cls.toFixed(3)} | < 0.1 |
| TBT | ${(tbt).toFixed(0)}ms | < 200ms |
| TTFB | ${(ttfb).toFixed(0)}ms | < 600ms |

**View detailed report:** [Lighthouse HTML Report](https://storage.googleapis.com/lighthouse-infrastructure.appspot.com/reports/${Date.now()}.html)

---
✅ Lighthouse audit completed successfully!
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Check Performance Budget
        if: always()
        run: |
          echo "Performance audit completed!"
          echo "View results in the 'lighthouse-results' artifact"
          lhci status

      - name: Fail if performance budget exceeded
        if: failure()
        run: |
          echo "❌ Performance budget exceeded or audit failed"
          echo "Please review the Lighthouse report and optimize your code"
          exit 1

  performance-tracking:
    name: Track Performance Metrics
    runs-on: ubuntu-latest
    needs: lighthouse-ci
    if: always()

    steps:
      - name: Download Lighthouse results
        uses: actions/download-artifact@v3
        with:
          name: lighthouse-results

      - name: Store results in database
        run: |
          echo "Performance metrics stored for trend analysis"
          # In production, these would be stored in a database for trending
          # Example: Push to InfluxDB, CloudWatch, Datadog, or custom API

      - name: Create performance dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Lighthouse CI results available at:"
          echo "https://app.netlify.com"
          echo "Performance dashboard: https://nftsol.app"
