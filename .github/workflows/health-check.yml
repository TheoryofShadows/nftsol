name: NFTSol CI - Build & Health Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: |
          cd apps/backend && npm ci
          cd ../../client && npm ci

      - name: 🔧 Build backend and client
        run: |
          cd apps/backend && npm run build
          cd ../../client && npm run build

      - name: 🚀 Start API in background
        run: |
          cd apps/backend
          nohup npm start &
          sleep 3

      - name: 🩺 Check API health endpoint
        run: |
          curl -sSf http://localhost:3001/health | grep '"status":"ok"'

      - name: ✅ Summary
        run: echo "✅ NFTSol CI passed on \${{ github.ref_name }}"
