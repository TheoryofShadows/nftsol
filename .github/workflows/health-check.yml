name: NFTSol CI - Build & Health Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: |
          cd apps/backend && npm ci
          cd ../../client && npm ci

      - name: 🔧 Build backend and client
        run: |
          cd apps/backend && npm run build
          cd ../../client && npm run build

      - name: 🧪 Run backend tests
        run: |
          cd apps/backend && npm test -- --no-coverage

      - name: ✅ Summary
        run: echo "✅ NFTSol CI passed on ${{ github.ref_name }}"
