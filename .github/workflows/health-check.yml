name: NFTSol CI - Build & Health Check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install root, client, and server dependencies
        run: |
          cd server && npm ci
          cd ../client && npm ci

      - name: 🔧 Build server and client
        run: |
          cd server && npm run build
          cd ../client && npm run build

      - name: 🚀 Start API in background
        run: |
          cd server
          nohup npm start &
          sleep 3

      - name: 🩺 Check API health endpoint
        run: |
          curl -sSf http://localhost:3001/healthz | grep '"ok":true'

      - name: ✅ Summary
        run: echo "✅ NFTSol CI passed on \${{ github.ref_name }}"
