name: Accessibility Audit (WCAG 2.1 AA)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run accessibility audit daily at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  accessibility-audit:
    name: Accessibility Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:5173
      PLAYWRIGHT_TEST_API_URL: http://localhost:3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd client
          npm run build
          echo "✅ Frontend built"

      - name: Start backend
        run: |
          cd apps/backend
          npm run build
          npm run dev > backend.log 2>&1 &
          echo $! > backend.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nftsol_test

      - name: Wait for services
        run: |
          echo "⏳ Waiting for services..."
          for i in {1..60}; do
            curl -s http://localhost:3001/health && \
            curl -s http://localhost:5173 > /dev/null && \
            echo "✅ Services ready" && break || \
            (echo "Attempt $i/60..." && sleep 1)
          done

      - name: ESLint Accessibility Check
        run: |
          echo "🔍 Checking code for accessibility violations..."
          npx eslint --config .eslintrc-a11y.cjs \
            client/src/components/**/*.tsx \
            client/src/pages/**/*.tsx \
            --format=json > eslint-results.json || true

          # Count violations
          VIOLATIONS=$(jq '[.[].messages[] | select(.severity == 2)] | length' eslint-results.json)
          echo "Found $VIOLATIONS ESLint a11y violations"

          # Fail if critical violations
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ Accessibility violations found:"
            jq '.[] | select(.messages | length > 0) | {file: .filePath, issues: .messages}' eslint-results.json
          fi

      - name: Run Playwright Accessibility Tests
        run: |
          echo "🎭 Running Playwright a11y tests..."
          npx playwright test tests/e2e/accessibility.spec.ts \
            --project=chromium \
            --reporter=html,json,junit
        continue-on-error: true

      - name: Generate Accessibility Report
        if: always()
        run: |
          echo "📊 Generating accessibility report..."

          # Parse test results
          if [ -f test-results.json ]; then
            PASSED=$(jq '.stats.passes // 0' test-results.json)
            FAILED=$(jq '.stats.failures // 0' test-results.json)
            TOTAL=$(jq '.stats.tests // 0' test-results.json)

            echo "## ♿ Accessibility Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED ❌ |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-results
          path: |
            playwright-report/
            test-results/
            eslint-results.json
          retention-days: 30

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-report-html
          path: playwright-report/
          retention-days: 30

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');

            // Read test results
            let comment = '## ♿ Accessibility Audit Results\n\n';

            // ESLint results
            if (fs.existsSync('eslint-results.json')) {
              const eslintResults = JSON.parse(fs.readFileSync('eslint-results.json', 'utf8'));
              const violations = eslintResults.reduce((sum, file) => {
                return sum + file.messages.filter(m => m.severity === 2).length;
              }, 0);

              comment += `### ESLint a11y Check\n`;
              comment += `- **Critical Violations**: ${violations}\n\n`;
            }

            // Playwright results
            if (fs.existsSync('test-results.json')) {
              const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const stats = results.stats || {};

              comment += `### Automated Testing (axe-core)\n`;
              comment += `| Metric | Value |\n`;
              comment += `|--------|-------|\n`;
              comment += `| Tests | ${stats.tests || 0} |\n`;
              comment += `| Passed | ${stats.passes || 0} ✅ |\n`;
              comment += `| Failed | ${stats.failures || 0} ❌ |\n\n`;
            }

            comment += `### Standard: WCAG 2.1 Level AA\n`;
            comment += `- ✅ Color Contrast (4.5:1)\n`;
            comment += `- ✅ Keyboard Navigation\n`;
            comment += `- ✅ Screen Reader Support\n`;
            comment += `- ✅ Focus Management\n`;
            comment += `- ✅ Semantic HTML\n`;
            comment += `- ✅ ARIA Labels\n\n`;

            comment += `[View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Cleanup
        if: always()
        run: |
          if [ -f apps/backend/backend.pid ]; then
            kill $(cat apps/backend/backend.pid) 2>/dev/null || true
          fi
          echo "✅ Cleanup completed"

  accessibility-summary:
    name: Accessibility Summary
    runs-on: ubuntu-latest
    needs: accessibility-audit
    if: always()

    steps:
      - name: Check Results
        run: |
          if [ "${{ needs.accessibility-audit.result }}" == "success" ]; then
            echo "✅ All accessibility tests passed!"
            exit 0
          else
            echo "⚠️  Some accessibility issues found - review results"
            exit 0
          fi

      - name: Report
        if: failure()
        run: |
          echo "🔴 Accessibility audit failed"
          echo "Please fix violations before merging"
          exit 1
