name: SonarQube Code Quality Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  sonarqube-scan:
    name: SonarQube Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: |
          cd apps/backend
          npm run build

      - name: Build frontend
        run: |
          cd client
          npm run build

      - name: Run tests with coverage
        run: npm run test -- --coverage
        continue-on-error: true

      - name: Generate coverage reports
        run: |
          # Merge coverage reports from backend and frontend
          mkdir -p coverage-merged
          cp -r apps/backend/coverage/* coverage-merged/ 2>/dev/null || true
          cp -r client/coverage/* coverage-merged/ 2>/dev/null || true
        continue-on-error: true

      - name: Run SonarQube Scanner
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=nftsol
            -Dsonar.organization=nftsol-org
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.metrics.min=75
            -Dsonar.qualitygate.wait=true

      - name: Check Quality Gate
        if: always()
        run: |
          echo "Quality Gate Check"
          echo "For SonarCloud, quality gate status is automatically checked"
          echo "View results: https://sonarcloud.io/dashboard?id=nftsol"

      - name: Comment PR with Quality Gate Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Code quality analysis completed. View results: https://sonarcloud.io/dashboard?id=nftsol'
            })

      - name: Fail if quality gate failed
        if: failure()
        run: |
          echo "❌ Quality gate failed. Code does not meet quality standards."
          echo "Please review the SonarQube dashboard and fix the issues."
          exit 1

  code-quality-report:
    name: Generate Quality Report
    runs-on: ubuntu-latest
    needs: sonarqube-scan
    if: always()

    steps:
      - name: Download quality metrics
        run: |
          echo "Quality metrics available at:"
          echo "https://sonarcloud.io/dashboard?id=nftsol"

      - name: Notify team
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'SonarQube quality gate failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
