[toolchain]
anchor_version = "0.29.0"

[features]
resolution = true
skip-lint = false

[programs.devnet]
eternal_echoes = "14Z6HF4jSdKJse3C6uL6pyodepAZojVgqcMGDARwgNFG"

[programs.localnet]
eternal_echoes = "14Z6HF4jSdKJse3C6uL6pyodepAZojVgqcMGDARwgNFG"

[programs.mainnet]
eternal_echoes = "14Z6HF4jSdKJse3C6uL6pyodepAZojVgqcMGDARwgNFG"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/eternal_echoes"]

[scripts]
test = "ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 10000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
ledger = '.anchor\test-ledger'
rpc_port = 8899

[[test.validator.account]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
filename = "mpl_token_metadata.so"
