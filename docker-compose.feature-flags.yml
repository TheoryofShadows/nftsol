version: '3.8'

# Docker Compose for Feature Flags (Unleash)
# Start with: docker-compose -f docker-compose.feature-flags.yml up -d
# Admin: http://localhost:3004

services:
  # ===== POSTGRESQL (Unleash backend) =====
  postgres:
    image: postgres:14-alpine
    container_name: nftsol-unleash-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unleash}
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
    volumes:
      - unleash_postgres_data:/var/lib/postgresql/data
    networks:
      - feature-flags
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unleash']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== UNLEASH (Feature Flag Management) =====
  unleash:
    image: unleashorg/unleash:latest
    container_name: nftsol-unleash
    ports:
      - "3004:3000"
    environment:
      DATABASE_URL: postgresql://unleash:${DB_PASSWORD:-unleash}@postgres:5432/unleash
      UNLEASH_URL: http://localhost:3004
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      # Authentication
      UNLEASH_AUTHENTICATION_TYPE: open
      # CORS
      CORS_ORIGIN: '*'
      # Performance
      DATABASE_MIN_POOL: 10
      DATABASE_MAX_POOL: 50
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - feature-flags
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "monitoring=true"
      - "service=feature-flags"

  # ===== UNLEASH PROXY (For frontend access) =====
  unleash-proxy:
    image: unleashorg/unleash-proxy:latest
    container_name: nftsol-unleash-proxy
    ports:
      - "3005:8080"
    environment:
      UNLEASH_URL: http://unleash:3000
      UNLEASH_API_TOKEN: ${UNLEASH_PROXY_TOKEN:-default:development.unleash-insecure-frontend-token-secret}
      UNLEASH_ENVIRONMENT: development
      UNLEASH_INSTANCE_ID: nftsol-proxy-1
      # CORS for frontend
      CORS_ORIGIN: '*'
      # Cache
      HTTP_CACHE_TTL: 3600
    depends_on:
      unleash:
        condition: service_healthy
    networks:
      - feature-flags
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8080/client/features']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "monitoring=true"
      - "service=feature-flags-proxy"

  # ===== ADMINER (Database GUI - Optional) =====
  adminer:
    image: adminer:latest
    container_name: nftsol-unleash-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - feature-flags
    restart: unless-stopped
    labels:
      - "monitoring=true"
      - "service=database-gui"

  # ===== REDIS (Optional - for caching) =====
  redis:
    image: redis:7-alpine
    container_name: nftsol-unleash-cache
    ports:
      - "6381:6379"
    volumes:
      - unleash_redis_data:/data
    networks:
      - feature-flags
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "monitoring=true"
      - "service=cache"

  # ===== NGINX (Reverse Proxy) =====
  nginx:
    image: nginx:latest
    container_name: nftsol-unleash-nginx
    ports:
      - "4000:80"
    volumes:
      - ./config/nginx/feature-flags.conf:/etc/nginx/conf.d/feature-flags.conf
      - nginx_unleash_cache:/var/cache/nginx
    depends_on:
      - unleash
      - unleash-proxy
    networks:
      - feature-flags
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "monitoring=true"
      - "service=reverse-proxy"

volumes:
  unleash_postgres_data:
    driver: local
  unleash_redis_data:
    driver: local
  nginx_unleash_cache:
    driver: local

networks:
  feature-flags:
    driver: bridge

# Quick access URLs:
# - Unleash Admin: http://localhost:3004
# - Unleash API: http://localhost:3004/api
# - Unleash Proxy: http://localhost:3005 (for frontend)
# - Adminer (DB): http://localhost:8081
# - Nginx Gateway: http://localhost:4000
