version: '3.8'

# Docker Compose for Monitoring Stack (Prometheus + Grafana)
# Start with: docker-compose -f docker-compose.monitoring.yml up -d

services:
  # ===== PROMETHEUS =====
  prometheus:
    image: prom/prometheus:latest
    container_name: nftsol-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== GRAFANA =====
  grafana:
    image: grafana/grafana:latest
    container_name: nftsol-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== ALERTMANAGER =====
  alertmanager:
    image: prom/alertmanager:latest
    container_name: nftsol-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:9093/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== NODE EXPORTER =====
  node-exporter:
    image: prom/node-exporter:latest
    container_name: nftsol-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    restart: unless-stopped

  # ===== POSTGRES EXPORTER =====
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nftsol-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: 'postgresql://postgres:postgres@postgres:5432/nftsol?sslmode=disable'
    networks:
      - monitoring
    depends_on:
      - postgres
    restart: unless-stopped

  # ===== REDIS EXPORTER =====
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: nftsol-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis:6379
    networks:
      - monitoring
    depends_on:
      - redis
    restart: unless-stopped

  # ===== CADVISOR (Container Metrics) =====
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nftsol-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: unless-stopped
    privileged: true

  # ===== POSTGRES (shared with app) =====
  postgres:
    image: postgres:14-alpine
    container_name: nftsol-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nftsol
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== REDIS (shared with app) =====
  redis:
    image: redis:7-alpine
    container_name: nftsol-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  postgres_data:
  redis_data:

networks:
  monitoring:
    driver: bridge
