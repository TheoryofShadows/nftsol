<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- Background gradient -->
  <rect width="400" height="400" fill="url(#grad)"/>
  
  <!-- Geometric pattern overlay -->
  <circle cx="100" cy="100" r="60" fill="white" opacity="0.1" filter="url(#blur)"/>
  <circle cx="300" cy="300" r="80" fill="white" opacity="0.1" filter="url(#blur)"/>
  
  <!-- NFT Icon -->
  <g transform="translate(200, 180)">
    <rect x="-40" y="-40" width="80" height="80" rx="12" fill="white" opacity="0.2"/>
    <rect x="-35" y="-35" width="70" height="70" rx="8" fill="white" opacity="0.3"/>
    <path d="M -20,-10 L 0,-25 L 20,-10 L 20,15 L 0,25 L -20,15 Z" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="white">
    NFT
  </text>
  <text x="200" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" opacity="0.8">
    Image Not Available
  </text>
</svg>
