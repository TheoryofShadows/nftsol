<!DOCTYPE html>
<html>
<head>
  <title>Wallet Test</title>
  <script>
    window.addEventListener('load', function() {
      const checkWallets = () => {
        const results = {
          phantom: !!window.solana,
          phantomIsPhantom: window.solana?.isPhantom,
          solflare: !!window.solflare,
          anyWallet: !!window.solana || !!window.solflare || !!window.backpack
        };
        
        document.getElementById('results').innerHTML = `
          <h2>Wallet Detection Results:</h2>
          <pre>${JSON.stringify(results, null, 2)}</pre>
          <hr>
          <h3>All Window Properties (wallets):</h3>
          <ul>
            ${Object.keys(window).filter(k => 
              k.toLowerCase().includes('phantom') || 
              k.toLowerCase().includes('solana') || 
              k.toLowerCase().includes('wallet')
            ).map(k => `<li><strong>${k}</strong>: ${typeof window[k]}</li>`).join('')}
          </ul>
        `;
        
        if (window.solana && window.solana.isPhantom) {
          const btn = document.getElementById('connectBtn');
          btn.style.display = 'block';
          btn.onclick = async () => {
            try {
              const res = await window.solana.connect();
              alert('Connected: ' + res.publicKey.toString());
            } catch (err) {
              alert('Error: ' + err.message);
            }
          };
        }
      };
      
      setTimeout(checkWallets, 500);
    });
  </script>
</head>
<body style="padding: 20px; font-family: monospace;">
  <h1>Solana Wallet Detection Test</h1>
  <div id="results">Checking...</div>
  <button id="connectBtn" style="display:none; margin-top: 20px; padding: 10px 20px; font-size: 16px;">
    Connect Phantom
  </button>
</body>
</html>
