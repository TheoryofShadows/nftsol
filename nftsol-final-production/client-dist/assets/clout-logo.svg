<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring with gradient -->
  <circle cx="32" cy="32" r="30" fill="url(#gradient1)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Inner circle -->
  <circle cx="32" cy="32" r="24" fill="url(#gradient2)"/>
  
  <!-- CLOUT text -->
  <text x="32" y="38" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CLOUT</text>
  
  <!-- Solana logo elements -->
  <rect x="20" y="20" width="8" height="4" fill="white" rx="1"/>
  <rect x="20" y="26" width="8" height="4" fill="white" rx="1"/>
  <rect x="20" y="32" width="8" height="4" fill="white" rx="1"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
