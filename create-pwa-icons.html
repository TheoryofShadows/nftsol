<!DOCTYPE html>
<html>
<head>
  <title>NFTSol PWA Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #0A0A0A;
      color: white;
    }
    .canvas-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    canvas {
      border: 2px solid #9945FF;
      border-radius: 10px;
    }
    button {
      background: linear-gradient(135deg, #9945FF, #14F195);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>🎨 NFTSol PWA Icon Generator</h1>
  <p>Generate icons for your Progressive Web App</p>
  
  <div class="canvas-container">
    <canvas id="icon192" width="192" height="192"></canvas>
    <canvas id="icon512" width="512" height="512"></canvas>
    <canvas id="icon180" width="180" height="180"></canvas>
    <canvas id="icon32" width="32" height="32"></canvas>
    <canvas id="icon16" width="16" height="16"></canvas>
  </div>
  
  <div>
    <button onclick="generateIcons()">Generate Icons</button>
    <button onclick="downloadAll()">Download All</button>
  </div>
  
  <script>
    function generateIcons() {
      const sizes = [
        { id: 'icon192', size: 192 },
        { id: 'icon512', size: 512 },
        { id: 'icon180', size: 180 },
        { id: 'icon32', size: 32 },
        { id: 'icon16', size: 16 }
      ];
      
      sizes.forEach(({ id, size }) => {
        const canvas = document.getElementById(id);
        const ctx = canvas.getContext('2d');
        
        // Background gradient
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, '#9945FF');
        gradient.addColorStop(0.5, '#14F195');
        gradient.addColorStop(1, '#00D4FF');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
        
        // Solana lightning bolt icon
        ctx.fillStyle = 'white';
        ctx.font = `bold ${size * 0.6}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚡', size / 2, size / 2);
      });
    }
    
    function downloadCanvas(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    function downloadAll() {
      downloadCanvas(document.getElementById('icon192'), 'pwa-192x192.png');
      setTimeout(() => downloadCanvas(document.getElementById('icon512'), 'pwa-512x512.png'), 100);
      setTimeout(() => downloadCanvas(document.getElementById('icon180'), 'apple-touch-icon.png'), 200);
      setTimeout(() => downloadCanvas(document.getElementById('icon32'), 'favicon-32x32.png'), 300);
      setTimeout(() => downloadCanvas(document.getElementById('icon16'), 'favicon-16x16.png'), 400);
    }
    
    // Generate on load
    window.onload = generateIcons;
  </script>
</body>
</html>
