[build]
  base = "client"
  publish = "dist"
  command = "npm install --include=dev && npm run build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  NPM_CONFIG_PRODUCTION = "false"

# Frontend redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

## API is hosted on Render; no Netlify Functions proxy needed

# Frontend environment variables
[context.production.environment]
  NODE_ENV = "production"
  VITE_API_BASE = "https://nftsol.onrender.com"
  VITE_SOLANA_CLUSTER = "mainnet-beta"
  VITE_SOLANA_RPC_URL = "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  VITE_API_BASE = "https://nftsol.onrender.com"

# Develop branch settings (for devnet testing)
[context.develop.environment]
  NODE_ENV = "development"
  VITE_API_BASE = "https://nftsol.onrender.com"
  VITE_SOLANA_CLUSTER = "devnet"
  VITE_SOLANA_RPC_URL = "https://api.devnet.solana.com"

# Functions configuration
# No Netlify Functions used for this site
