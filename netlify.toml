[build]
  base = "client"
  publish = "dist"
  command = "npm install --include=dev && npm run build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  NPM_CONFIG_PRODUCTION = "false"
  # Disable submodule checkout to prevent build errors
  GIT_SUBMODULE_CHECKOUT = "false"

# Frontend redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API is hosted on Render; no Netlify Functions proxy needed
# Custom domain: nftsol.app (configure in Netlify dashboard under Domain Management)

# Frontend environment variables
[context.production.environment]
  NODE_ENV = "production"
  VITE_API_BASE = "https://nftsol.onrender.com"
  VITE_SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
  VITE_HELIUS_API_KEY = "$HELIUS_API_KEY"
  VITE_SOLANA_CLUSTER = "mainnet-beta"

[context.develop.environment]
  NODE_ENV = "development"
  VITE_API_BASE = "https://nftsol.onrender.com"
  VITE_SOLANA_CLUSTER = "devnet"
  VITE_SOLANA_RPC_URL = "https://api.devnet.solana.com"
  VITE_HELIUS_API_KEY = "$HELIUS_API_KEY"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  VITE_API_BASE = "https://nftsol.onrender.com"
  VITE_HELIUS_API_KEY = "$HELIUS_API_KEY"
