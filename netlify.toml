[build]
  base = "client"
  publish = "dist"
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# Frontend redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

## API is hosted on Render; no Netlify Functions proxy needed

# Frontend environment variables
[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "development"

# Functions configuration
# No Netlify Functions used for this site
