[build]
  base = "client"
  publish = "dist"
  command = "npm install --include=dev && npm run build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  NPM_CONFIG_PRODUCTION = "false"
  # Disable submodule checkout to prevent build errors
  GIT_SUBMODULE_CHECKOUT = "false"

# Frontend redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for cache control (especially Safari)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

## API is hosted on Render; no Netlify Functions proxy needed

# Frontend environment variables
[context.production.environment]
  NODE_ENV = "production"
  VITE_API_BASE = "https://nftsol.onrender.com"
  VITE_SOLANA_RPC_URL = "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  VITE_API_BASE = "https://nftsol.onrender.com"

# Functions configuration
# No Netlify Functions used for this site
