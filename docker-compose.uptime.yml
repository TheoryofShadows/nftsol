version: '3.8'

# Docker Compose for Uptime Monitoring Stack
# Start with: docker-compose -f docker-compose.uptime.yml up -d
# Frontend: http://localhost:3000
# Admin: http://localhost:3001

services:
  # ===== UPTIME KUMA =====
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: nftsol-uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - monitoring
    environment:
      # SSL configuration (optional)
      # UPTIME_KUMA_ENABLE_COMPRESSION: true
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3001/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "monitoring=true"
      - "service=uptime-monitoring"

  # ===== STATUS PAGE (Optional - can use Uptime Kuma's built-in) =====
  status-page:
    image: cstate/cstate:latest
    container_name: nftsol-status-page
    ports:
      - "3000:3000"
    volumes:
      - ./config/cstate:/app/config
      - status_page_data:/app/data
    networks:
      - monitoring
    environment:
      - TZ=UTC
      - SITE_NAME=NFTSol Status
      - SITE_DESCRIPTION=Real-time service status and incident history
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "monitoring=true"
      - "service=status-page"

  # ===== ALERTMANAGER (if using with Prometheus) =====
  alertmanager:
    image: prom/alertmanager:latest
    container_name: nftsol-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:9093/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "monitoring=true"
      - "service=alerting"

  # ===== WEBHOOK RECEIVER (for custom integrations) =====
  webhook-receiver:
    image: node:20-alpine
    container_name: nftsol-webhook-receiver
    ports:
      - "9095:3000"
    volumes:
      - ./scripts/webhook-receiver:/app
      - webhook_logs:/app/logs
    working_dir: /app
    command: node index.js
    networks:
      - monitoring
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_DIR=/app/logs
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "monitoring=true"
      - "service=webhooks"

  # ===== REDIS (for webhook queuing) =====
  redis:
    image: redis:7-alpine
    container_name: nftsol-redis-monitoring
    ports:
      - "6380:6379"
    volumes:
      - redis_monitoring_data:/data
    networks:
      - monitoring
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "monitoring=true"
      - "service=webhook-queue"

  # ===== POSTGRESQL (for incident history) =====
  postgres:
    image: postgres:14-alpine
    container_name: nftsol-postgres-monitoring
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
    volumes:
      - postgres_monitoring_data:/var/lib/postgresql/data
      - ./scripts/init-monitoring-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monitoring']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "monitoring=true"
      - "service=incident-history"

  # ===== NGINX (reverse proxy and load balancer) =====
  nginx:
    image: nginx:latest
    container_name: nftsol-monitoring-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/monitoring.conf:/etc/nginx/conf.d/monitoring.conf
      - ./certs:/etc/nginx/certs:ro
      - nginx_monitoring_cache:/var/cache/nginx
    networks:
      - monitoring
    depends_on:
      - uptime-kuma
      - status-page
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "monitoring=true"
      - "service=reverse-proxy"

volumes:
  uptime_kuma_data:
    driver: local
  status_page_data:
    driver: local
  alertmanager_data:
    driver: local
  webhook_logs:
    driver: local
  redis_monitoring_data:
    driver: local
  postgres_monitoring_data:
    driver: local
  nginx_monitoring_cache:
    driver: local

networks:
  monitoring:
    driver: bridge
