[allowlist]
  description = "Allowed patterns to reduce false positives"
  paths = [
    "^client/dist/",
    "\\.svg$",
    "\\.png$",
    "\\.jpg$",
    "\\.webp$",
    "\\.gif$",
    "src/config/programs\\.ts$",
    "\\.md$",
    "\\.example$"
  ]

[[rules]]
  id = "generic-jwt"
  description = "Generic JWT token"
  regex = '''(?i)eyJhbGciOiJ[a-zA-Z0-9_-]{5,}\.[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'''
  tags = ["key", "jwt"]

[[rules]]
  id = "postgres-url-with-password"
  description = "Postgres URL with password"
  regex = '''postgresql:\/\/[A-Za-z0-9_.-]+:.[^@\s]+@[^\s]+\/(?:[A-Za-z0-9_-]+)'''
  tags = ["db", "credential"]

[[rules]]
  id = "base58-private-key"
  description = "Likely Solana private key assigned to a secret/private variable"
  regex = '''(?i)(?:private[_-]?key|secret[_-]?key|wallet[_-]?secret|platform[_-]?secret|_secret_base58)[^\n]{0,50}[1-9A-HJ-NP-Za-km-z]{44,}'''
  tags = ["key", "solana"]

[[rules]]
  id = "pinata-key"
  description = "Pinata API key"
  regex = '''(?i)pinata[_-]?(api[_-]?key|secret[_-]?key)\s*=\s*['\"][A-Za-z0-9]{20,}['\"]'''
  tags = ["key", "pinata"]

[[rules]]
  id = "helius-api-key"
  description = "Helius API key in URL"
  regex = '''https:\/\/.*helius.*api-key=([A-Za-z0-9-]{20,})'''
  tags = ["key", "helius"]
